services:
  mpau-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: mpau-web:local
    container_name: mpau-web
    restart: unless-stopped
    env_file:
      - docker.env
    ports:
      - "${MPAU_HOST_PORT:-8788}:8788"
    volumes:
      - mpau-data:/var/lib/mpau/data
      - ../windows/output:/var/lib/mpau/releases:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mpau-data:
    name: mpau-data
